# ==============================================================================
# Alembic Configuration File
#
# WHY Alembic?
# SQLAlchemy's create_all() creates tables but CANNOT modify existing ones.
# Alembic tracks schema changes as versioned migration scripts.
# Every change to a model becomes an "upgrade" script with a matching "downgrade".
# In production, you ONLY apply schema changes via: alembic upgrade head
# NEVER alter tables manually in production.
#
# Common commands:
#   alembic revision --autogenerate -m "description"  → generate migration
#   alembic upgrade head                               → apply all pending migrations
#   alembic downgrade -1                               → rollback one migration
#   alembic history                                    → show migration history
#   alembic current                                    → show current DB version
# ==============================================================================

[alembic]
# Path to migration scripts (relative to alembic.ini location)
script_location = alembic

# Template for auto-generated revision file names
# Result: 20240115_1432_abc12345_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Add the project root to sys.path so `from app.xxx import` works in env.py
prepend_sys_path = .

# Use UTC timestamps in migration files
timezone = UTC

# sqlalchemy.url is overridden in alembic/env.py from DATABASE_URL env var.
# This placeholder prevents Alembic from complaining about a missing URL.
sqlalchemy.url = postgresql://placeholder

[post_write_hooks]
# Uncomment to auto-format generated migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
