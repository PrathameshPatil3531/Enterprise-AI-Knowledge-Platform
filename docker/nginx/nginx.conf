# ==============================================================================
# Nginx Configuration — Reverse Proxy
#
# WHY Nginx in front of FastAPI?
# - TLS termination: Nginx handles HTTPS so FastAPI doesn't have to
# - Static file serving: React build files served directly, no Python overhead
# - Routing: /api/* → FastAPI, /* → React SPA
# - Gzip compression: Nginx compresses responses automatically
# - Request buffering: Protects FastAPI from slow client attacks
# ==============================================================================

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # ---- Static Frontend (React SPA) ----
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ---- API Proxy → FastAPI ----
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (generous for AI endpoints that may take several seconds)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # File upload size limit (must match backend MAX_FILE_SIZE_MB)
        client_max_body_size 55M;
    }

    # ---- Health Check Proxy ----
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ---- React Router (SPA fallback) ----
    # Any URL not matched above serves index.html
    # React Router handles the routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
